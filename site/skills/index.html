<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>All Agent Skills - Rogue Asset Store</title>
  <meta name="description" content="Explore our complete collection of Agent Skills for Cursor, Claude Code, and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../asset-store/site.css" />
</head>
<body data-base="../" class="has-browse-sidebar">
  <div class="page page-browse">
    <header class="top" data-site-nav></header>

    <div class="browse-shell" data-filter-layout="sidebar">
      <aside class="browse-sidebar" aria-label="Filters">
        <div class="filter-block">
          <h2 class="filter-heading">Catalog</h2>
          <div class="kind-tabs kind-tabs-stack" role="tablist" aria-label="Catalog kind">
            <a class="kind-tab" href="../servers/">MCP Servers</a>
            <a class="kind-tab is-active" href="../skills/" aria-current="page">Agent Skills</a>
            <a class="kind-tab" href="../assets/">Assets</a>
          </div>
        </div>
        <div class="filter-block filter-block-categories">
          <h2 class="filter-heading">Categories</h2>
          <nav class="filter-tree" data-catalog-chips aria-label="Categories"></nav>
        </div>
      </aside>

      <div class="browse-content">
        <section class="browse-hero browse-hero-compact">
          <p class="breadcrumb"><a href="../">Home</a> <span>/</span> <a href="../skills/">Agent Skills</a> <span>/</span> <span aria-current="page">All</span></p>
          <div class="browse-facet-row" data-browse-facets></div>
          <div class="search-bar search-bar-lg">
            <span class="search-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="M20 20l-3.5-3.5"></path>
              </svg>
            </span>
            <label class="sr-only" for="catalog-q">Search</label>
            <input id="catalog-q" type="search" data-catalog-search placeholder="Search for Agent Skills..." autocomplete="off" />
          </div>
        </section>

        <section class="catalog browse-main" data-catalog="skills" data-mode="all" data-filter-style="sidebar">
          <ul class="skill-list catalog-grid" data-catalog-list></ul>
          <div class="pager" data-catalog-pager></div>
        </section>
      </div>
    </div>

    <footer class="foot"></footer>
  </div>
  <script src="../asset-store/catalog-data.js" defer></script>
  <script src="../asset-store/catalog-cards.js" defer></script>
  <script src="../asset-store/site-root.js" defer></script>
  <script src="../asset-store/catalog-github.js" defer></script>
  <script src="../asset-store/nav.js" defer></script>
  <script src="../asset-store/catalog.js" defer></script>
  <script src="../asset-store/github-stars.js" defer></script>
  <script src="../asset-store/github-authors.js" defer></script>
</body>
</html>
