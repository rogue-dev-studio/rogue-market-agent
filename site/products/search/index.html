<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search Digital Products - Rogue Assets Store</title>
  <meta name="description" content="Search Rogue digital products by name, category, tags, and price." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/site.css" />
</head>
<body data-base="../../" class="has-browse-sidebar">
  <div class="page page-browse">
    <header class="top" data-site-nav></header>

    <div class="browse-shell" data-filter-layout="sidebar">
      <aside class="browse-sidebar" aria-label="Filters">
        <div class="filter-block">
          <h2 class="filter-heading">Catalog</h2>
          <div class="kind-tabs kind-tabs-stack" role="tablist" aria-label="Catalog kind">
            <a class="kind-tab" href="../../servers/search/">MCP Servers</a>
            <a class="kind-tab" href="../../skills/search/">Agent Skills</a>
            <a class="kind-tab is-active" href="../../products/search/" aria-current="page">Digital Products</a>
          </div>
        </div>
        <div class="filter-block filter-block-categories">
          <h2 class="filter-heading">Categories</h2>
          <nav class="filter-tree" data-catalog-chips aria-label="Categories"></nav>
        </div>
      </aside>

      <div class="browse-content">
        <section class="browse-hero browse-hero-compact">
          <p class="breadcrumb"><a href="../../">Home</a> <span>/</span> <a href="../../products/">Digital Products</a> <span>/</span> <span aria-current="page">Search</span></p>
          <div class="browse-facet-row" data-browse-facets></div>
          <div class="search-bar search-bar-lg search-bar-explore">
            <span class="search-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="M20 20l-3.5-3.5"></path>
              </svg>
            </span>
            <label class="sr-only" for="catalog-q">Search</label>
            <input id="catalog-q" type="search" data-catalog-search placeholder="Search digital products..." autocomplete="off" />
          </div>
        </section>

        <section class="catalog browse-main" data-catalog="products" data-mode="search" data-filter-style="sidebar">
          <ul class="skill-list catalog-grid" data-catalog-list></ul>
          <div class="pager" data-catalog-pager></div>
        </section>
      </div>
    </div>

    <footer class="foot"></footer>
  </div>
  <script src="../../assets/catalog-data.js" defer></script>
  <script src="../../assets/catalog-cards.js" defer></script>
  <script src="../../assets/catalog-product-taxonomy.js" defer></script>
  <script src="../../assets/catalog-products.js" defer></script>
  <script src="../../assets/catalog-products-sketchfab.js" defer></script>
  <script src="../../assets/catalog-products-stores.js" defer></script>
  <script src="../../assets/site-root.js" defer></script>
  <script src="../../assets/nav.js" defer></script>
  <script src="../../assets/catalog.js" defer></script>
</body>
</html>
